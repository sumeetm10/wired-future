<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Wired Future">
  <rect width="32" height="32" rx="7" fill="#0b071e"/>

  <!-- Horizon grid: the terrain, reduced to three lines that still read at 16px. -->
  <g stroke="#00f0ff" stroke-linecap="round" fill="none">
    <path d="M4 25h24" stroke-width="1.6" opacity="0.95"/>
    <path d="M7 21h18" stroke-width="1.3" opacity="0.6"/>
    <path d="M10 17.6h12" stroke-width="1.1" opacity="0.35"/>
  </g>

  <!-- Centre-stage object, held above the grid. -->
  <path d="M16 6.5 L23.5 12 L16 17.5 L8.5 12 Z"
        fill="none" stroke="#00f0ff" stroke-width="1.9" stroke-linejoin="round"/>
  <circle cx="16" cy="12" r="2.4" fill="#ff2bd6"/>
</svg>
