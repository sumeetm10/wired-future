name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` and no `npm ci`: both hard-fail when package-lock.json
      # has not been committed, which is the usual state of a fresh hackathon
      # repo. npm install works either way and uses the lockfile when present.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /wired-future
          # Optional. Add a repo secret named ORIGIN_TRIAL_TOKEN to enable
          # WebMCP for ordinary Chrome visitors; the build works without it.
          NEXT_PUBLIC_ORIGIN_TRIAL_TOKEN: ${{ secrets.ORIGIN_TRIAL_TOKEN }}

      - name: Ensure .nojekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
